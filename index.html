        .gallery {

        /* ============================================ */
        /* CADA BLOQUE: IMAGEN + ENCABEZADO + PIE         */
        /* ============================================ */
        .gallery-item {

            flex-direction: column;
            align-items: stretch;
            background: transparent;
            container-type: inline-size;
            position: relative;
        }

        /* ============================================ */
        /* ENCABEZADO DE CADA IMAGEN (texto negro)      */
        /* ============================================ */
        .item-header {
            width: 100%;
            text-align: center;
            padding: 10px 5px 8px 5px;
            color: #000000;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: transparent;
            border-bottom: 2px solid rgba(74, 144, 217, 0.3);

            flex-shrink: 0;
            pointer-events: none;

            background: rgba(255, 255, 255, 0.6);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            white-space: nowrap;
            font-size: clamp(0.55rem, 2.2vw, 1.1rem);
            pointer-events: none;
        }

        /* ============================================ */
        /* CONTENEDOR DE LA IMAGEN (SIN BORDES)         */
        /* ============================================ */
        .image-wrapper {
            width: 100%;
            flex-shrink: 0;
            position: relative;
            pointer-events: none;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            box-shadow: none;
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }

        /* Capa protectora invisible sobre la imagen */
        .image-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* PIE DE CADA IMAGEN (texto BLANCO)            */
        /* ============================================ */

        /* ============================================ */
        /* BARRA DE REDES SOCIALES (ABAJO DE IMÁGENES)  */
        /* ============================================ */
        .social-bar-container {

        .social-btn {

            height: 38px;

            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            pointer-events: auto;
            animation: float 3s ease-in-out infinite;
        }

        /* Desfase de animación flotante */
        .social-btn:nth-child(1) { animation-delay: 0s; }
        .social-btn:nth-child(2) { animation-delay: 0.2s; }
        .social-btn:nth-child(3) { animation-delay: 0.4s; }
        .social-btn:nth-child(4) { animation-delay: 0.6s; }
        .social-btn:nth-child(5) { animation-delay: 0.8s; }

        .social-btn:hover {
            transform: translateY(-5px) scale(1.12);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.25);
        }

        .social-btn svg {
            width: 100%;
            height: 100%;
            display: block;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* ============================================ */
        /* RESPONSIVE: MÓVIL (1 columna)                */
        /* ============================================ */
        .gallery {
            grid-template-columns: 1fr;
        }

        /* ============================================ */
        /* RESPONSIVE: TABLET (2-3 columnas)            */
        /* ============================================ */
        @media (min-width: 600px) {
            .gallery {

            }
        }

        @media (min-width: 850px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);

        /* ============================================ */
        /* RESPONSIVE: ESCRITORIO (4-5 columnas)        */
        /* ============================================ */
        @media (min-width: 1100px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1400px) {
            .gallery {

            font-size: 0.65rem;
            z-index: 9999;
            pointer-events: none;
            backdrop-filter: blur(4px);
            opacity: 0.5;
        }
    </style>
</head>

        (function() {
            'use strict';

            // 1. BLOQUEO DE CLICK DERECHO
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // 2. BLOQUEO DE SELECCIÓN DE TEXTO
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });

            // 3. BLOQUEO DE ARRASTRAR IMÁGENES
            document.addEventListener('dragstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });

            // 4. BLOQUEO DE DESCARGA DE IMÁGENES
            document.addEventListener('click', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });

            // 5. BLOQUEO DE TECLAS DE ATAJO
            document.addEventListener('keydown', function(e) {
                if (e.key === 'F12') { e.preventDefault(); return false; }
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) { e.preventDefault(); return false; }
                if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) { e.preventDefault(); return false; }
                if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) { e.preventDefault(); return false; }
                if (e.ctrlKey && (e.key === 'S' || e.key === 's')) { e.preventDefault(); return false; }
                if (e.ctrlKey && (e.key === 'P' || e.key === 'p')) { e.preventDefault(); return false; }
                if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) { e.preventDefault(); return false; }
                if (e.key === 'ContextMenu') { e.preventDefault(); return false; }
                return true;
            });

            // 6. BLOQUEO DE CAPTURAS DE PANTALLA
            document.addEventListener('keyup', function(e) {
                if (e.key === 'PrintScreen') {
                    const notice = document.querySelector('.protection-notice');
                    if (notice) {
                        notice.textContent = '🚫 Captura de pantalla bloqueada';
                        notice.style.opacity = '1';
                        notice.style.background = 'rgba(200, 0, 0, 0.8)';
                        setTimeout(() => {
                            notice.textContent = '🔒 Contenido protegido';
                            notice.style.opacity = '0.5';
                            notice.style.background = 'rgba(0, 0, 0, 0.7)';
                        }, 2000);
                    }
                    return false;
                }
            });

            // 7. PROTECCIÓN CONTRA COPIADO
            document.addEventListener('copy', function(e) { e.preventDefault(); return false; });
            document.addEventListener('cut', function(e) { e.preventDefault(); return false; });

            // 8. BLOQUEO DE TOUCH EN IMÁGENES
            document.addEventListener('touchstart', function(e) {
                if (e.target.tagName === 'IMG') { e.preventDefault(); return false; }
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (e.target.closest('.image-wrapper')) { e.preventDefault(); return false; }
            }, { passive: false });

            // 9. DESHABILITAR GESTOS DE ZOOM
            document.addEventListener('gesturestart', function(e) { e.preventDefault(); return false; });
            document.addEventListener('gesturechange', function(e) { e.preventDefault(); return false; });
            document.addEventListener('gestureend', function(e) { e.preventDefault(); return false; });

            // 10. BLOQUEAR DOBLE CLICK
            document.addEventListener('dblclick', function(e) {
                if (e.target.tagName === 'IMG' || e.target.closest('.image-wrapper')) {
                    e.preventDefault();
                    return false;
                }
            });

            // 11. EVITAR GUARDADO POR ARRASTRAR

            document.addEventListener('dragover', function(e) { e.preventDefault(); return false; });

            const images = document.querySelectorAll('img');

                    return false;

                fallback.style.width = '100%';
                fallback.innerHTML = `
                            <span style="font-size:2.5rem;">🖼️</span>
                            <p style="margin-top:10px; font-weight:600;">Imagen ${index + 1} no disponible</p>
                            <p style="font-size:0.75rem; color:#666; margin-top:4px;">Verifica el enlace</p>
                        `;
                wrapper.appendChild(fallback);
            };

            wrapper.appendChild(img);
            item.appendChild(wrapper);

            const footer = document.createElement('div');
            footer.className = 'item-footer';
            footer.textContent = fechas[index];
            item.appendChild(footer);

            gallery.appendChild(item);
        });

        console.log('✅ Galería cargada con protección total.');
    </script>

</body>
</html>

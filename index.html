<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ELECTROCELL JM ES - Protección Total</title>
    <style>
        /* ============================================ */
        /* RESET Y ESTILOS BASE */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #E8F4FD;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        /* ============================================ */
        /* CONTENEDOR DE IMÁGENES */
        /* ============================================ */
        .gallery {
            display: grid;
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            justify-items: center;
            align-items: start;
            pointer-events: none;
        }

        .gallery-item {
            pointer-events: none;
        }

        .gallery-item img {
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }

        /* ============================================ */
        /* CADA BLOQUE: IMAGEN + ENCABEZADO + PIE      */
        /* ============================================ */
        .gallery-item {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: transparent;
            container-type: inline-size;
            position: relative;
        }

        /* ============================================ */
        /* ENCABEZADO DE CADA IMAGEN (texto negro) */
        /* ============================================ */
        .item-header {
            width: 100%;
            text-align: center;
            padding: 10px 5px 8px 5px;
            color: #000000;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: transparent;
            border-bottom: 2px solid rgba(74, 144, 217, 0.3);
            margin-bottom: 5px;
            flex-shrink: 0;
            pointer-events: none;
        }

        .item-header span {
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            white-space: nowrap;
            font-size: clamp(0.55rem, 2.2vw, 1.1rem);
            pointer-events: none;
        }

        /* ============================================ */
        /* CONTENEDOR DE LA IMAGEN (SIN BORDES) */
        /* ============================================ */
        .image-wrapper {
            width: 100%;
            flex-shrink: 0;
            position: relative;
            pointer-events: none;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            box-shadow: none;
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
            -webkit-touch-callout: none;
        }

        /* Capa protectora invisible sobre la imagen */
        .image-wrapper::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            /* Bloquea cualquier interacción */;
        }

        /* ============================================ */
        /* PIE DE CADA IMAGEN (texto BLANCO) */
        /* ============================================ */
        .item-footer {
            width: 100%;
            text-align: center;
            padding: 10px 5px 10px 5px;
            color: #FFFFFF;
            font-weight: 500;
            background: rgba(26, 58, 92, 0.7);
            border-radius: 0;
            margin-top: 5px;
            backdrop-filter: blur(2px);
            flex-shrink: 0;
            font-size: clamp(0.55rem, 1.8vw, 0.85rem);
            white-space: nowrap;
            overflow: visible;
            pointer-events: none;
        }

        /* ============================================ */
        /* RESPONSIVE: MÓVIL (1 columna) */
        /* ============================================ */
        .gallery {
            grid-template-columns: 1fr;
        }

        /* ============================================ */
        /* RESPONSIVE: TABLET (2-3 columnas) */
        /* ============================================ */
        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 850px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* ============================================ */
        /* RESPONSIVE: ESCRITORIO (4-5 columnas) */
        /* ============================================ */
        @media (min-width: 1100px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1400px) {
            .gallery {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* ============================================ */
        /* PIE DE PÁGINA GENERAL (estilo del sitio) */
        /* ============================================ */
        .footer-general {
            margin-top: 50px;
            padding: 20px 0 10px;
            width: 100%;
            max-width: 1300px;
            text-align: center;
            border-top: 2px solid rgba(74, 144, 217, 0.25);
            color: #2C5F8A;
            font-size: 0.9rem;
            pointer-events: none;
        }

        .footer-general strong {
            color: #1A3A5C;
        }

        .footer-general .badge {
            display: inline-block;
            background: #4A90D9;
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin: 4px 4px;
            pointer-events: none;
        }

        .footer-general .badge.azul-oscuro {
            background: #2C5F8A;
        }

        /* ============================================ */
        /* MENSAJE DE CARGA */
        /* ============================================ */
        .loading-msg {
            color: #2C5F8A;
            font-size: 1.1rem;
            padding: 40px;
            text-align: center;
            grid-column: 1 / -1;
            pointer-events: none;
        }

        /* Advertencia de protección */
        .protection-notice {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            z-index: 9999;
            pointer-events: none;
            backdrop-filter: blur(4px);
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- GALERÍA DE 5 IMÁGENES                     -->
    <!-- ========================================== -->
    <div class="gallery" id="imageGallery">
        <div class="loading-msg">
            ⏳ Cargando imágenes...
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PIE DE PÁGINA GENERAL                      -->
    <!-- ========================================== -->
    <footer class="footer-general">
        <p>
            <strong>ELECTROCELL JM ES</strong> · Powered by José Martínez
        </p>
        <p>
            <span class="badge">📱 +503 70555683</span>
            <span class="badge azul-oscuro">✉️ electrocellim.es@gmail.com</span>
        </p>
        <p style="margin-top:10px; font-size:0.8rem; opacity:0.7;">
            www.electrocelljm.es · Todos los derechos reservados
        </p>
    </footer>

    <!-- Aviso de protección -->
    <div class="protection-notice">🔒 Contenido Protegido</div>

    <!-- ========================================== -->
    <!-- SCRIPT DE PROTECCIÓN TOTAL                -->
    <!-- ========================================== -->
    <script>
        // ============================================================
        // 🔒 PROTECCIÓN AVANZADA CONTRA FILTRACIONES
        // ============================================================

        (function() {
            'use strict';

            // ============================================================
            // 1. BLOQUEO DE CLICK DERECHO (context menu)
            // ============================================================
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 2. BLOQUEO DE SELECCIÓN DE TEXTO (en toda la página)
            // ============================================================
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 3. BLOQUEO DE ARRASTRAR IMÁGENES (drag)
            // ============================================================
            document.addEventListener('dragstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 4. BLOQUEO DE DESCARGA DE IMÁGENES (click en imágenes)
            // ============================================================
            document.addEventListener('click', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 5. BLOQUEO DE TECLAS DE ATAJO (F12, Ctrl+Shift+I, etc.)
            // ============================================================
            document.addEventListener('keydown', function(e) {
                // Bloquear F12
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+Shift+I (inspeccionar)
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+Shift+J (consola)
                if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+U (ver código fuente)
                if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+S (guardar página)
                if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+P (imprimir)
                if (e.ctrlKey && (e.key === 'P' || e.key === 'p')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+Shift+C (inspeccionar elemento)
                if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear tecla de menú (contexto)
                if (e.key === 'ContextMenu') {
                    e.preventDefault();
                    return false;
                }

                return true;
            });

            // ============================================================
            // 6. BLOQUEO DE CAPTURAS DE PANTALLA (via PrintScreen)
            // ============================================================
            document.addEventListener('keyup', function(e) {
                if (e.key === 'PrintScreen') {
                    // Mostrar advertencia sutil
                    const notice = document.querySelector('.protection-notice');
                    if (notice) {
                        notice.textContent = '🚫 Captura de pantalla bloqueada';
                        notice.style.opacity = '1';
                        notice.style.background = 'rgba(200, 0, 0, 0.8)';
                        setTimeout(() => {
                            notice.textContent = '🔒 Contenido protegido';
                            notice.style.opacity = '0.5';
                            notice.style.background = 'rgba(0, 0, 0, 0.7)';
                        }, 2000);
                    }
                    return false;
                }
            });

            // ============================================================
            // 7. PROTECCIÓN CONTRA COPIADO (clipboard)
            // ============================================================
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('cut', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 8. BLOQUEO DE TOUCH (para móviles - presionar largo)
            // ============================================================
            document.addEventListener('touchstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                // Previene el zoom y el scroll forzado en imágenes
                if (e.target.closest('.image-wrapper')) {
                    e.preventDefault();
                    return false;
                }
            }, { passive: false });

            // ============================================================
            // 9. DESHABILITAR GESTOS DE ZOOM EN DISPOSITIVOS MÓVILES
            // ============================================================
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 10. BLOQUEAR DOBLE CLICK (selección accidental)
            // ============================================================
            document.addEventListener('dblclick', function(e) {
                if (e.target.tagName === 'IMG' || e.target.closest('.image-wrapper')) {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 11. EVITAR QUE LAS IMÁGENES SE GUARDEN POR ARRASTRE
            // ============================================================
            document.addEventListener('drop', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('dragover', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 12. PROTECCIÓN ADICIONAL: Ocultar el menú contextual en imágenes
            // ============================================================
            const images = document.querySelectorAll('img');
            images.forEach(img => {
                img.addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    return false;
                });
            });

            console.log('🔒 Protección total activada: click derecho, selección, descarga, capturas y más.');
            console.log('📱 Compatible con iOS, Android, Windows, Linux y macOS.');
        })();

        // ============================================================
        // CARGAR IMÁGENES (con protección)
        // ============================================================
        const imageUrls = [
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785026696/Pol%C3%ADticas_generales_jyibsz.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031036/Garant%C3%ADa_de_6_meses_kln0zl.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031036/Verificaci%C3%B3n_y_respaldo_legal_para_reparaciones_de_dispositivos_uuf3cd.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031041/Protocolo_para_inicio_de_reparaciones_y_refacciones_solicitadas_bajo_pedido_hevaas.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031038/POL%C3%8DTICAS_DE_PRIVACIDAD_PROTECCI%C3%93N_DE_DATOS_Y_SEGURIDAD_T%C3%89CNICA_hikv8v.jpg"
        ];

        const headers = [
            "📋 REGISTRO DE EQUIPOS",
            "🔧 POLÍTICAS DE GARANTÍA",
            "📱 DUI OBLIGATORIO",
            "⚡ PROTOCOLO DE INICIO",
            "🔒 POLÍTICA DE PRIVACIDAD"
        ];

        const fechas = [
            "06 de Enero 2025",
            "01 de Septiembre 2025",
            "01 de Diciembre 2025",
            "01 de Junio 2026",
            "01 de Junio 2026"
        ];

        const gallery = document.getElementById('imageGallery');
        gallery.innerHTML = '';

        imageUrls.forEach((url, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';

            const header = document.createElement('div');
            header.className = 'item-header';
            header.innerHTML = `<span>${headers[index]}</span>`;
            item.appendChild(header);

            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            const img = document.createElement('img');
            img.src = url;
            img.alt = `Condición de Servicio ${index + 1}`;
            img.loading = 'lazy';
            img.draggable = false;

            img.onerror = function() {
                this.style.display = 'none';
                const fallback = document.createElement('div');
                fallback.style.padding = '60px 15px';
                fallback.style.textAlign = 'center';
                fallback.style.color = '#1A3A5C';
                fallback.style.fontSize = '0.95rem';
                fallback.style.background = 'rgba(255,255,255,0.5)';
                fallback.style.width = '100%';
                fallback.innerHTML = `
                            <span style="font-size:2.5rem;">🖼️</span>
                            <p style="margin-top:10px; font-weight:600;">Imagen ${index + 1} no disponible</p>
                            <p style="font-size:0.75rem; color:#666; margin-top:4px;">Verifica el enlace</p>
                        `;
                wrapper.appendChild(fallback);
            };

            wrapper.appendChild(img);
            item.appendChild(wrapper);

            const footer = document.createElement('div');
            footer.className = 'item-footer';
            footer.textContent = fechas[index];
            item.appendChild(footer);

            gallery.appendChild(item);
        });

        console.log('✅ Galería cargada con protección total.');
    </script>

</body>
</html>

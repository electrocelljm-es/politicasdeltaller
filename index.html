<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>ELECTROCELL JM ES - Protección Total</title>
    <style>
        /* ============================================ */
        /* RESET Y ESTILOS BASE */
        /* ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #E8F4FD;
            font-family: 'Segoe UI', 'Roboto', Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            position: relative;
        }

        /* ============================================ */
        /* SUPERPOSICIÓN PROTECTORA (dificulta capturas) */
        /* ============================================ */
        .protection-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99999;
            pointer-events: none;
            /* No interfiere con clicks */;
        }

        /* Capa de "ruido" que interfiere con capturas */
        .protection-overlay::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 2px,
                    rgba(255, 255, 255, 0.01) 2px,
                    rgba(255, 255, 255, 0.01) 4px);
            mix-blend-mode: overlay;
            pointer-events: none;
        }

        /* Patrón de interferencia adicional */
        .protection-overlay::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-radial-gradient(circle at 20% 30%,
                    rgba(0, 0, 0, 0.01) 0px,
                    rgba(0, 0, 0, 0.01) 3px,
                    rgba(255, 255, 255, 0.01) 3px,
                    rgba(255, 255, 255, 0.01) 6px);
            mix-blend-mode: difference;
            pointer-events: none;
        }

        /* ============================================ */
        /* CONTENEDOR DE IMÁGENES */
        /* ============================================ */
        .gallery {
            display: grid;
            gap: 30px;
            width: 100%;
            max-width: 1300px;
            justify-items: center;
            align-items: start;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }

        .gallery-item {
            pointer-events: none;
            position: relative;
        }

        .gallery-item img {
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
        }

        /* ============================================ */
        /* CADA BLOQUE: IMAGEN + ENCABEZADO + PIE      */
        /* ============================================ */
        .gallery-item {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            background: transparent;
            container-type: inline-size;
            position: relative;
        }

        /* ============================================ */
        /* ENCABEZADO DE CADA IMAGEN (texto negro) */
        /* ============================================ */
        .item-header {
            width: 100%;
            text-align: center;
            padding: 10px 5px 8px 5px;
            color: #000000;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: transparent;
            border-bottom: 2px solid rgba(74, 144, 217, 0.3);
            margin-bottom: 5px;
            flex-shrink: 0;
            pointer-events: none;
        }

        .item-header span {
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 16px;
            border-radius: 20px;
            display: inline-block;
            white-space: nowrap;
            font-size: clamp(0.55rem, 2.2vw, 1.1rem);
            pointer-events: none;
        }

        /* ============================================ */
        /* CONTENEDOR DE LA IMAGEN - CON CAPA PROTECTORA */
        /* ============================================ */
        .image-wrapper {
            width: 100%;
            flex-shrink: 0;
            position: relative;
            pointer-events: none;
        }

        .gallery-item img {
            display: block;
            width: 100%;
            height: auto;
            box-shadow: none;
            pointer-events: none;
            -webkit-user-drag: none;
            user-drag: none;
            -webkit-touch-callout: none;
            position: relative;
            z-index: 1;
        }

        /* Capa protectora invisible sobre la imagen */
        .image-wrapper::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background: repeating-linear-gradient(90deg,
                    transparent,
                    transparent 3px,
                    rgba(255, 255, 255, 0.005) 3px,
                    rgba(255, 255, 255, 0.005) 6px);
            mix-blend-mode: soft-light;
        }

        /* ============================================ */
        /* PIE DE CADA IMAGEN (texto BLANCO) */
        /* ============================================ */
        .item-footer {
            width: 100%;
            text-align: center;
            padding: 10px 5px 10px 5px;
            color: #FFFFFF;
            font-weight: 500;
            background: rgba(26, 58, 92, 0.7);
            border-radius: 0;
            margin-top: 5px;
            backdrop-filter: blur(2px);
            flex-shrink: 0;
            font-size: clamp(0.55rem, 1.8vw, 0.85rem);
            white-space: nowrap;
            overflow: visible;
            pointer-events: none;
        }

        /* ============================================ */
        /* RESPONSIVE: MÓVIL (1 columna) */
        /* ============================================ */
        .gallery {
            grid-template-columns: 1fr;
        }

        @media (min-width: 600px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 850px) {
            .gallery {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1100px) {
            .gallery {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (min-width: 1400px) {
            .gallery {
                grid-template-columns: repeat(5, 1fr);
            }
        }

        /* ============================================ */
        /* PIE DE PÁGINA GENERAL */
        /* ============================================ */
        .footer-general {
            margin-top: 50px;
            padding: 20px 0 10px;
            width: 100%;
            max-width: 1300px;
            text-align: center;
            border-top: 2px solid rgba(74, 144, 217, 0.25);
            color: #2C5F8A;
            font-size: 0.9rem;
            pointer-events: none;
            position: relative;
            z-index: 1;
        }

        .footer-general strong {
            color: #1A3A5C;
        }

        .footer-general .badge {
            display: inline-block;
            background: #4A90D9;
            color: white;
            padding: 2px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            margin: 4px 4px;
            pointer-events: none;
        }

        .footer-general .badge.azul-oscuro {
            background: #2C5F8A;
        }

        .loading-msg {
            color: #2C5F8A;
            font-size: 1.1rem;
            padding: 40px;
            text-align: center;
            grid-column: 1 / -1;
            pointer-events: none;
        }

        /* ============================================ */
        /* AVISO DE PROTECCIÓN FLOTANTE */
        /* ============================================ */
        .protection-notice {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            z-index: 999999;
            pointer-events: none;
            backdrop-filter: blur(4px);
            opacity: 0.5;
        }

        /* ============================================ */
        /* ADVERTENCIA DE CAPTURA (popup visual) */
        /* ============================================ */
        .screenshot-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(200, 0, 0, 0.9);
            color: white;
            padding: 20px 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            z-index: 9999999;
            display: none;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            pointer-events: none;
        }

        .screenshot-warning.show {
            display: block;
            animation: warningPulse 0.3s ease;
        }

        @keyframes warningPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        /* ============================================ */
        /* DETECTOR DE CAPTURAS (elemento invisible) */
        /* ============================================ */
        .screenshot-detector {
            position: fixed;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            background: transparent;
            z-index: -1;
        }

        /* ============================================ */
        /* OVERLAY DE AGUA (marca de agua dinámica) */
        /* ============================================ */
        .watermark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 99998;
            background: repeating-linear-gradient(45deg,
                    transparent,
                    transparent 100px,
                    rgba(26, 58, 92, 0.02) 100px,
                    rgba(26, 58, 92, 0.02) 102px);
            background-size: 200px 200px;
        }

        .watermark-text {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            font-size: 3rem;
            font-weight: 900;
            color: rgba(26, 58, 92, 0.05);
            pointer-events: none;
            z-index: 99998;
            white-space: nowrap;
            letter-spacing: 10px;
            user-select: none;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body>

    <!-- ========================================== -->
    <!-- SUPERPOSICIÓN PROTECTORA (dificulta capturas) -->
    <!-- ========================================== -->
    <div class="protection-overlay"></div>

    <!-- ========================================== -->
    <!-- MARCA DE AGUA DINÁMICA -->
    <!-- ========================================== -->
    <div class="watermark-overlay"></div>
    <div class="watermark-text">ELECTROCELL JM ES</div>

    <!-- ========================================== -->
    <!-- AVISO DE CAPTURA -->
    <!-- ========================================== -->
    <div class="screenshot-warning" id="screenshotWarning">
        🚫 CAPTURA DE PANTALLA DETECTADA<br>
        <span style="font-size:0.8rem; opacity:0.8;">Esta acción está prohibida</span>
    </div>

    <!-- ========================================== -->
    <!-- GALERÍA DE 5 IMÁGENES                     -->
    <!-- ========================================== -->
    <div class="gallery" id="imageGallery">
        <div class="loading-msg">
            ⏳ Cargando imágenes...
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PIE DE PÁGINA GENERAL                      -->
    <!-- ========================================== -->
    <footer class="footer-general">
        <p>
            <strong>ELECTROCELL JM ES</strong> · Powered by José Martínez
        </p>
        <p>
            <span class="badge">📱 +503 70555683</span>
            <span class="badge azul-oscuro">✉️ electrocellim.es@gmail.com</span>
        </p>
        <p style="margin-top:10px; font-size:0.8rem; opacity:0.7;">
            www.electrocelljm.es · Todos los derechos reservados
        </p>
    </footer>

    <!-- Aviso de protección -->
    <div class="protection-notice">🔒 Contenido protegido</div>

    <!-- ========================================== -->
    <!-- DETECTOR DE CAPTURAS (invisible) -->
    <!-- ========================================== -->
    <div class="screenshot-detector" id="screenshotDetector"></div>

    <!-- ========================================== -->
    <!-- SCRIPT DE PROTECCIÓN TOTAL                -->
    <!-- ========================================== -->
    <script>
        // ============================================================
        // 🔒 PROTECCIÓN AVANZADA CONTRA FILTRACIONES
        // ============================================================

        (function() {
            'use strict';

            // ============================================================
            // 1. BLOQUEO DE CLICK DERECHO (context menu)
            // ============================================================
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 2. BLOQUEO DE SELECCIÓN DE TEXTO
            // ============================================================
            document.addEventListener('selectstart', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 3. BLOQUEO DE ARRASTRAR IMÁGENES
            // ============================================================
            document.addEventListener('dragstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 4. BLOQUEO DE DESCARGA DE IMÁGENES
            // ============================================================
            document.addEventListener('click', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 5. BLOQUEO DE TECLAS DE ATAJO
            // ============================================================
            document.addEventListener('keydown', function(e) {
                // Bloquear F12
                if (e.key === 'F12') {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+Shift+I (inspeccionar)
                if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+Shift+J (consola)
                if (e.ctrlKey && e.shiftKey && (e.key === 'J' || e.key === 'j')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+U (ver código fuente)
                if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+S (guardar página)
                if (e.ctrlKey && (e.key === 'S' || e.key === 's')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+P (imprimir)
                if (e.ctrlKey && (e.key === 'P' || e.key === 'p')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear Ctrl+Shift+C (inspeccionar elemento)
                if (e.ctrlKey && e.shiftKey && (e.key === 'C' || e.key === 'c')) {
                    e.preventDefault();
                    return false;
                }

                // Bloquear tecla de menú
                if (e.key === 'ContextMenu') {
                    e.preventDefault();
                    return false;
                }

                // Bloquear PrintScreen (detección)
                if (e.key === 'PrintScreen') {
                    showScreenshotWarning();
                    e.preventDefault();
                    return false;
                }

                return true;
            });

            // ============================================================
            // 6. BLOQUEO DE COPIADO
            // ============================================================
            document.addEventListener('copy', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('cut', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 7. BLOQUEO DE TOUCH (móviles)
            // ============================================================
            document.addEventListener('touchstart', function(e) {
                if (e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            }, { passive: false });

            document.addEventListener('touchmove', function(e) {
                if (e.target.closest('.image-wrapper')) {
                    e.preventDefault();
                    return false;
                }
            }, { passive: false });

            // ============================================================
            // 8. DESHABILITAR GESTOS DE ZOOM
            // ============================================================
            document.addEventListener('gesturestart', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('gesturechange', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('gestureend', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 9. BLOQUEAR DOBLE CLICK
            // ============================================================
            document.addEventListener('dblclick', function(e) {
                if (e.target.tagName === 'IMG' || e.target.closest('.image-wrapper')) {
                    e.preventDefault();
                    return false;
                }
            });

            // ============================================================
            // 10. EVITAR DROP
            // ============================================================
            document.addEventListener('drop', function(e) {
                e.preventDefault();
                return false;
            });

            document.addEventListener('dragover', function(e) {
                e.preventDefault();
                return false;
            });

            // ============================================================
            // 11. DETECCIÓN DE CAPTURAS DE PANTALLA
            // ============================================================
            let warningTimeout = null;

            function showScreenshotWarning() {
                const warning = document.getElementById('screenshotWarning');
                if (!warning) return;

                warning.classList.add('show');

                if (warningTimeout) {
                    clearTimeout(warningTimeout);
                }

                warningTimeout = setTimeout(() => {
                    warning.classList.remove('show');
                }, 3000);

                // También vibrar si es posible
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }
            }

            // Detectar PrintScreen a través de blur/focus
            let lastBlurTime = 0;

            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    lastBlurTime = Date.now();
                } else {
                    // Si estuvo oculto por menos de 500ms, podría ser una captura
                    if (Date.now() - lastBlurTime < 500 && lastBlurTime > 0) {
                        showScreenshotWarning();
                    }
                    lastBlurTime = 0;
                }
            });

            // ============================================================
            // 12. DETECCIÓN DE CAPTURAS EN MÓVILES (eventos de fondo)
            // ============================================================
            document.addEventListener('pause', function() {
                // App entra en background (posible captura en iOS)
                lastBlurTime = Date.now();
            });

            document.addEventListener('resume', function() {
                if (Date.now() - lastBlurTime < 1000 && lastBlurTime > 0) {
                    showScreenshotWarning();
                }
                lastBlurTime = 0;
            });

            // ============================================================
            // 13. PROTEGER CONTRA VISTA PREVIA DE IMPRESIÓN
            // ============================================================
            const style = document.createElement('style');
            style.textContent = `
                        @media print {
                            body * { display: none !important; }
                            body::before {
                                content: "📄 No se permite imprimir este contenido";
                                display: block !important;
                                font-size: 2rem;
                                padding: 50px;
                                text-align: center;
                                color: red;
                                background: white;
                            }
                        }
                    `;
            document.head.appendChild(style);

            // ============================================================
            // 14. FORZAR QUE LAS IMÁGENES NO SEAN VISIBLES EN PRINT
            // ============================================================
            const imgStyle = document.createElement('style');
            imgStyle.textContent = `
                        @media print {
                            img { display: none !important; }
                            .image-wrapper { display: none !important; }
                            .gallery-item { display: none !important; }
                            .item-footer { display: none !important; }
                            .item-header { display: none !important; }
                        }
                    `;
            document.head.appendChild(imgStyle);

            // ============================================================
            // 15. DESHABILITAR DRAG DE IMÁGENES EN TODOS LOS NAVEGADORES
            // ============================================================
            document.querySelectorAll('img').forEach(img => {
                img.draggable = false;
                img.setAttribute('draggable', 'false');
            });

            // Observar cambios dinámicos
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    mutation.addedNodes.forEach(function(node) {
                        if (node.tagName === 'IMG') {
                            node.draggable = false;
                            node.setAttribute('draggable', 'false');
                        }
                    });
                });
            });

            observer.observe(document.body, { childList: true, subtree: true });

            console.log('🔒 Protección total activada: click derecho, selección, descarga, capturas y más.');
            console.log('📱 Compatible con iOS, Android, Windows, Linux y macOS.');
            console.log('⚠️ Nota: Ningún método web puede bloquear completamente las capturas de pantalla.');
        })();

        // ============================================================
        // CARGAR IMÁGENES
        // ============================================================
        const imageUrls = [
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785026696/Pol%C3%ADticas_generales_jyibsz.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031036/Garant%C3%ADa_de_6_meses_kln0zl.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031036/Verificaci%C3%B3n_y_respaldo_legal_para_reparaciones_de_dispositivos_uuf3cd.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031041/Protocolo_para_inicio_de_reparaciones_y_refacciones_solicitadas_bajo_pedido_hevaas.jpg",
            "https://res.cloudinary.com/hfktpwsx/image/upload/v1785031038/POL%C3%8DTICAS_DE_PRIVACIDAD_PROTECCI%C3%93N_DE_DATOS_Y_SEGURIDAD_T%C3%89CNICA_hikv8v.jpg"
        ];

        const headers = [
            "📋 REGISTRO DE EQUIPOS",
            "🔧 POLÍTICAS DE GARANTÍA",
            "📱 DUI OBLIGATORIO",
            "⚡ PROTOCOLO DE INICIO",
            "🔒 POLÍTICA DE PRIVACIDAD"
        ];

        const fechas = [
            "06 de Enero 2025",
            "01 de Septiembre 2025",
            "01 de Diciembre 2025",
            "01 de Junio 2026",
            "01 de Junio 2026"
        ];

        const gallery = document.getElementById('imageGallery');
        gallery.innerHTML = '';

        imageUrls.forEach((url, index) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';

            const header = document.createElement('div');
            header.className = 'item-header';
            header.innerHTML = `<span>${headers[index]}</span>`;
            item.appendChild(header);

            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';

            const img = document.createElement('img');
            img.src = url;
            img.alt = `Condición de Servicio ${index + 1}`;
            img.loading = 'lazy';
            img.draggable = false;
            img.setAttribute('draggable', 'false');

            img.onerror = function() {
                this.style.display = 'none';
                const fallback = document.createElement('div');
                fallback.style.padding = '60px 15px';
                fallback.style.textAlign = 'center';
                fallback.style.color = '#1A3A5C';
                fallback.style.fontSize = '0.95rem';
                fallback.style.background = 'rgba(255,255,255,0.5)';
                fallback.style.width = '100%';
                fallback.innerHTML = `
                            <span style="font-size:2.5rem;">🖼️</span>
                            <p style="margin-top:10px; font-weight:600;">Imagen ${index + 1} no disponible</p>
                            <p style="font-size:0.75rem; color:#666; margin-top:4px;">Verifica el enlace</p>
                        `;
                wrapper.appendChild(fallback);
            };

            wrapper.appendChild(img);
            item.appendChild(wrapper);

            const footer = document.createElement('div');
            footer.className = 'item-footer';
            footer.textContent = fechas[index];
            item.appendChild(footer);

            gallery.appendChild(item);
        });

        console.log('✅ Galería cargada con protección total.');
    </script>

</body>
</html>
